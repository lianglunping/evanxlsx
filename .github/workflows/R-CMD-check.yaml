name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release, label: linux-release}
          - {os: windows-latest, r: release, label: windows-release}
          - {os: macos-latest, r: release, label: macos-arm-release}
          - {os: macos-15-intel, r: release, label: macos-intel-release}
          - {os: ubuntu-latest, r: oldrel-1, label: linux-oldrel}
          - {os: ubuntu-22.04, r: '4.1.3', label: linux-minimum}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
          needs: check
      - name: R CMD build and check
        run: Rscript tools/check.R
        shell: bash
      - name: Install three ways and test synthetic data
        run: Rscript tools/install_check.R
        shell: bash
      - name: Show check summary
        if: always()
        run: |
          for log in validation/local-*/*.Rcheck/00check.log validation/portable-*/STATUS.txt; do
            if [ -f "$log" ]; then cat "$log"; fi
          done
        shell: bash
      - name: Retain logs, source package and synthetic workbooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.config.label }}
          path: |
            validation/local-*/
            validation/portable-*/
          if-no-files-found: warn
          retention-days: 14
