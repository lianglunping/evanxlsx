name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check package and retain logs locally
        run: Rscript tools/check.R
        shell: bash
      - name: Show R check log
        if: always()
        run: |
          for log in validation/local-*/*.Rcheck/00check.log; do
            if [ -f "$log" ]; then cat "$log"; fi
          done
        shell: bash
      - name: Retain check logs and built source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: R-check-${{ matrix.os }}
          path: validation/local-*/
          if-no-files-found: warn
          retention-days: 14
