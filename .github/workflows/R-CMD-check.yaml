name: R-CMD-check
on:
  push:
    branches: [main, 'feature/0.3.0-data-tools']
    paths-ignore: ['validation/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evanxlsx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-release, os: ubuntu-24.04, r: release, backend: true}
          - {name: windows-release, os: windows-latest, r: release, backend: true}
          - {name: macos-arm-release, os: macos-latest, r: release, backend: true}
          - {name: macos-intel-release, os: macos-15-intel, r: release, backend: true}
          - {name: linux-oldrel, os: ubuntu-24.04, r: oldrel-1, backend: true}
          - {name: linux-minimum-core, os: ubuntu-22.04, r: '4.1.3', backend: false}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NOT_CRAN: 'true'
      DUCKPLYR_FALLBACK_COLLECT: '0'
      DUCKPLYR_FALLBACK_AUTO: '0'
      EVANXLSX_BACKEND_TEST: ${{ matrix.backend }}
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install test dependencies
        shell: Rscript {0}
        run: |
          repos <- getOption('repos')
          if (nzchar(Sys.getenv('RSPM'))) repos <- c(RSPM = Sys.getenv('RSPM'))
          options(repos = c(repos, multiverse = 'https://community.r-multiverse.org'))
          core <- c('openxlsx2', 'testthat', 'xml2', 'tibble', 'remotes')
          optional <- c('duckplyr', 'polars', 'tidypolars', 'tidyselect', 'rlang', 'tidyr', 'stringr')
          packages <- if (Sys.getenv('EVANXLSX_BACKEND_TEST') == 'true') c(core, optional) else core
          install.packages(packages, Ncpus = 2)
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
          print(sessionInfo())
      - name: Native build and core checks
        run: Rscript tools/check.R
      - name: Source tar and private GitHub installation routes
        run: Rscript tools/install_check.R
      - name: Install R-built package for real backend tests
        if: matrix.backend
        shell: Rscript {0}
        run: |
          v <- read.dcf('DESCRIPTION')[1, 'Version']
          archives <- Sys.glob(paste0('validation/local-*/evanxlsx_', v, '.tar.gz'))
          stopifnot(length(archives) == 1L)
          install.packages(archives, repos = NULL, type = 'source')
      - name: Existing exporter integration
        if: matrix.backend
        run: Rscript tools/integration_check.R
      - name: Optional data module with R reference comparisons
        if: matrix.backend
        run: Rscript tools/data_check.R
      - name: Existing larger exports
        if: matrix.name == 'linux-release'
        run: Rscript tools/integration_check.R --large
      - name: Previously qualified Tidy recipes
        if: matrix.name == 'linux-release'
        run: Rscript --vanilla tools/tidy_smoke.R
      - name: Retain source identity
        if: always()
        shell: bash
        run: |
          mkdir -p validation/source
          git archive --format=zip --prefix=evanxlsx/ HEAD -o validation/source/evanxlsx_source.zip
          git rev-parse HEAD > validation/source/COMMIT.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.name }}
          path: |
            validation/local-*/
            validation/portable-*/
            validation/integration-*/
            validation/data-*/
            validation/large-*/
            validation/tidy-qualification/
            validation/source/
          retention-days: 30
  dependencies:
    name: auto-dependencies-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NOT_CRAN: 'true'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Required dependency resolution without optional engines
        run: Rscript tools/dependency_check.R
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auto-dependencies-${{ matrix.os }}
          path: |
            validation/dependencies-*/*.log
            validation/dependencies-*/*.txt
            validation/dependencies-*/*.csv
            validation/dependencies-*/*.xlsx
          retention-days: 30
