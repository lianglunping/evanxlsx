name: R-CMD-check
on:
  push:
    branches: [main, 'fix/0.2.1-review']
    paths-ignore: ['validation/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evanxlsx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-release, os: ubuntu-24.04, r: release, backend: true}
          - {name: windows-release, os: windows-latest, r: release, backend: true}
          - {name: macos-arm-release, os: macos-latest, r: release, backend: true}
          - {name: macos-intel-release, os: macos-15-intel, r: release, backend: true}
          - {name: linux-oldrel, os: ubuntu-24.04, r: oldrel-1, backend: true}
          - {name: linux-minimum-core, os: ubuntu-22.04, r: '4.1.3', backend: false}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NOT_CRAN: 'true'
      DUCKPLYR_FALLBACK_COLLECT: '0'
      DUCKPLYR_FALLBACK_AUTO: '0'
      EVANXLSX_BACKEND_TEST: ${{ matrix.backend }}
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install check dependencies and selected optional backends
        shell: Rscript {0}
        run: |
          repos <- getOption('repos')
          rspm <- Sys.getenv('RSPM')
          if (nzchar(rspm)) repos <- c(RSPM = rspm)
          repos <- c(repos, multiverse = 'https://community.r-multiverse.org')
          options(repos = repos)
          core <- c('openxlsx2', 'testthat', 'xml2', 'tibble', 'remotes')
          packages <- if (Sys.getenv('EVANXLSX_BACKEND_TEST') == 'true') c(core, 'duckplyr', 'polars') else core
          install.packages(packages, Ncpus = 2)
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
          print(sessionInfo())
      - name: Build and check core package
        run: Rscript tools/check.R
      - name: Three installation routes with core exports
        run: Rscript tools/install_check.R
      - name: Install R-built package for dedicated integration
        if: matrix.backend
        shell: Rscript {0}
        run: |
          version <- read.dcf('DESCRIPTION')[1, 'Version']
          archives <- Sys.glob(paste0('validation/local-*/evanxlsx_', version, '.tar.gz'))
          stopifnot(length(archives) == 1L)
          install.packages(archives, repos = NULL, type = 'source')
      - name: Real duckplyr and Polars integration, with no skipped tests
        if: matrix.backend
        run: Rscript tools/integration_check.R
      - name: Larger 10000-row by 72-column exports
        if: matrix.name == 'linux-release'
        run: Rscript tools/integration_check.R --large
      - name: Retain exact Git source snapshot
        if: always()
        shell: bash
        run: |
          mkdir -p validation/source
          git archive --format=zip --prefix=evanxlsx/ HEAD -o validation/source/evanxlsx_source.zip
          git rev-parse HEAD > validation/source/COMMIT.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.name }}
          path: |
            validation/local-*/
            validation/portable-*/
            validation/integration-*/
            validation/large-*/
            validation/source/
          retention-days: 14
  dependencies:
    name: auto-dependencies-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NOT_CRAN: 'true'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Required dependency resolution from isolated user libraries
        run: Rscript tools/dependency_check.R
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auto-dependencies-${{ matrix.os }}
          path: |
            validation/dependencies-*/*.log
            validation/dependencies-*/*.txt
            validation/dependencies-*/*.csv
            validation/dependencies-*/*.xlsx
          retention-days: 14
