name: README file IO examples
on:
  push:
    branches: [main, 'docs/io-guide-20261008']
    paths: ['README.md', 'README.en.md', 'tools/readme_check.R', '.github/workflows/readme-examples.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readme-io-${{ github.ref }}
  cancel-in-progress: true
jobs:
  examples:
    name: readme-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      NOT_CRAN: 'true'
      DUCKPLYR_FALLBACK_COLLECT: '0'
      DUCKPLYR_FALLBACK_AUTO: '0'
      _R_CHECK_FORCE_SUGGESTS_: 'false'
      EVANXLSX_BACKEND_TEST: 'true'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install documented example and check dependencies
        shell: Rscript {0}
        run: |
          repos <- getOption('repos')
          if (nzchar(Sys.getenv('RSPM'))) repos <- c(RSPM = Sys.getenv('RSPM'))
          options(repos = c(repos, multiverse = 'https://community.r-multiverse.org'))
          packages <- c('openxlsx2','tibble','testthat','xml2','readr','readxl','data.table',
                        'vroom','duckplyr','polars','dplyr','tidyr','stringr','rlang','tidyselect','tidypolars')
          install.packages(packages,Ncpus=2)
          stopifnot(all(vapply(packages,requireNamespace,logical(1),quietly=TRUE)))
      - name: Native package build and existing core checks
        run: Rscript tools/check.R
      - name: Install the R-built package
        shell: Rscript {0}
        run: |
          v <- read.dcf('DESCRIPTION')[1,'Version']
          archive <- Sys.glob(paste0('validation/local-*/evanxlsx_',v,'.tar.gz'))
          stopifnot(length(archive)==1L)
          install.packages(archive,repos=NULL,type='source')
      - name: Execute exact README snippets and check values, types and sheet operations
        run: Rscript --vanilla tools/readme_check.R
      - name: Retain exact source and Markdown
        if: always()
        shell: bash
        run: |
          mkdir -p validation/readme-source
          git archive --format=zip --prefix=evanxlsx/ HEAD -o validation/readme-source/source.zip
          git rev-parse HEAD > validation/readme-source/COMMIT.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readme-${{ matrix.os }}
          path: |
            validation/readme-*/
            validation/local-*/
          retention-days: 30
