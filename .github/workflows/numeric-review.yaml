name: Numeric range review
on:
  push:
    branches: ['review/0.3.1-workflows']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NOT_CRAN: 'true'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies and unchanged exporter
        shell: Rscript {0}
        run: |
          repos <- getOption('repos')
          if (nzchar(Sys.getenv('RSPM'))) repos <- c(RSPM = Sys.getenv('RSPM'))
          options(repos=c(repos, multiverse='https://community.r-multiverse.org'))
          install.packages(c('polars','rlang','tidyselect','openxlsx2','tidypolars','dplyr','tidyr','stringr'), Ncpus=2)
          install.packages('.', repos=NULL, type='source')
      - name: Observe numerical range and input semantics
        run: Rscript --vanilla tools/numeric_review.R
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numeric-review
          path: validation/numeric-review/
          retention-days: 30
